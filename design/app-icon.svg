<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<g transform="translate(100.0 100.0) scale(0.8046875)">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="232" ry="232"></rect>
    </clipPath>
    <clipPath id="keyClip">
      <rect x="64" y="192" width="768" height="640" rx="112" ry="112"></rect>
    </clipPath>
    <linearGradient id="deckTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"></stop>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop>
    </linearGradient>
    <linearGradient id="deckBottom" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.18"></stop>
      <stop offset="1" stop-color="#000000" stop-opacity="0"></stop>
    </linearGradient>
    <linearGradient id="keyTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.17"></stop>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"></stop>
    </linearGradient>
    <radialGradient id="ledGlowOuter">
      <stop offset="0" stop-color="#45e02c" stop-opacity="0.5"></stop>
      <stop offset="0.42" stop-color="#45e02c" stop-opacity="0.26"></stop>
      <stop offset="1" stop-color="#45e02c" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="ledGlowInner">
      <stop offset="0" stop-color="#45e02c" stop-opacity="0.95"></stop>
      <stop offset="0.5" stop-color="#45e02c" stop-opacity="0.55"></stop>
      <stop offset="1" stop-color="#45e02c" stop-opacity="0"></stop>
    </radialGradient>
    <filter id="keyfx" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.42"></feDropShadow>
      <feDropShadow dx="0" dy="0" stdDeviation="32" flood-color="#45e02c" flood-opacity="0.45"></feDropShadow>
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="0" y="0" width="1024" height="1024" fill="#c7c0b4"></rect>
    <rect x="0" y="0" width="1024" height="44" fill="url(#deckTop)"></rect>
    <rect x="0" y="924" width="1024" height="100" fill="url(#deckBottom)"></rect>

    <g fill="#92968f">
      <rect x="64" y="-144" width="768" height="288" rx="72" ry="72"></rect>
      <rect x="880" y="-144" width="240" height="288" rx="72" ry="72"></rect>
      <rect x="880" y="192" width="240" height="640" rx="72" ry="72"></rect>
      <rect x="64" y="880" width="768" height="288" rx="72" ry="72"></rect>
      <rect x="880" y="880" width="240" height="288" rx="72" ry="72"></rect>
    </g>

    <rect x="64" y="192" width="768" height="640" rx="112" ry="112" fill="#0b0d0c" filter="url(#keyfx)"></rect>
    <rect x="61" y="189" width="774" height="646" rx="115" ry="115" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="6"></rect>
    <g clip-path="url(#keyClip)">
      <rect x="64" y="192" width="768" height="96" fill="url(#keyTop)"></rect>
    </g>

    <circle cx="184" cy="312" r="150" fill="url(#ledGlowOuter)"></circle>
    <circle cx="184" cy="312" r="76" fill="url(#ledGlowInner)"></circle>
    <circle cx="184" cy="312" r="40" fill="#ffffff"></circle>

    <g transform="translate(136 465.92) scale(4.72)" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 18 H80"></path>
      <path d="M66 6 L80 18 L66 30"></path>
      <path d="M86 46 H20"></path>
      <path d="M34 34 L20 46 L34 58"></path>
    </g>
  </g>
</g>
</svg>